# Input level: severity channel into the widened prior-encoder projection
arm: scc
out_dir: runs/scc
# Shared budget for every DiffIR branch
root: /path/to/iPhoneBlur          # {train,test}/{video}/{blur,sharp}/{img_num:05d}.jpg
metadata: /path/to/complete_metadata.csv
manifest: data/split_manifest.csv
severity_dir: cache/severity
init_ckpt: checkpoints/dab_parent.pth   # DAB: 12 epochs from GoPro-pretrained DiffIR S2
epochs: 12
batch: 2
accum: 2
patch: 256
lr: 2.0e-5
lr_min: 1.0e-6
t_max: 34284          # period in scheduler steps; stepped once per update (17,136 updates per arm)
ema: 0.999
seed: 42              # runs 1-3: 42, 123, 456
